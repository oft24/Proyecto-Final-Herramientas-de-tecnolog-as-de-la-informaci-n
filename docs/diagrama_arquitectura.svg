<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de Dangoko Marketplace</title>
  <desc id="desc">El navegador habla con Flask en EC2. Compose contiene solo API y notificaciones; RDS y S3 son servicios AWS externos. Notifications usa Resend SMTP para reenviar correo.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="60" y="60" font-family="Arial" font-size="32" font-weight="700" fill="#0f172a">Dangoko Marketplace · Entrega Final</text>
  <text x="60" y="92" font-family="Arial" font-size="17" fill="#475569">Tema 3 · pedidos, S3, RDS y servicio de notificaciones</text>
  <rect x="60" y="210" width="200" height="110" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <text x="160" y="255" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#0c4a6e">Navegador</text>
  <text x="160" y="284" text-anchor="middle" font-family="Arial" font-size="16" fill="#0c4a6e">Catálogo y checkout</text>
  <rect x="380" y="180" width="250" height="170" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="505" y="230" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#7f1d1d">API Flask</text>
  <text x="505" y="265" text-anchor="middle" font-family="Arial" font-size="16" fill="#7f1d1d">Auth · pedidos · /salud</text>
  <text x="505" y="292" text-anchor="middle" font-family="Arial" font-size="16" fill="#7f1d1d">Docker · usuario no root</text>
  <rect x="790" y="120" width="280" height="120" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="930" y="165" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#14532d">RDS PostgreSQL</text>
  <text x="930" y="198" text-anchor="middle" font-family="Arial" font-size="16" fill="#14532d">Usuarios, pedidos, partidas</text>
  <rect x="790" y="290" width="280" height="120" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="930" y="335" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#78350f">S3 privado</text>
  <text x="930" y="368" text-anchor="middle" font-family="Arial" font-size="16" fill="#78350f">Recibos JSON · AES256</text>
  <rect x="380" y="450" width="250" height="100" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="505" y="492" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#4c1d95">Notifications</text>
  <text x="505" y="520" text-anchor="middle" font-family="Arial" font-size="16" fill="#4c1d95">Registro y Resend SMTP</text>
  <line x1="260" y1="265" x2="380" y2="265" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="630" y1="225" x2="790" y2="180" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="630" y1="290" x2="790" y2="350" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="505" y1="350" x2="505" y2="450" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="70" y="590" font-family="Arial" font-size="15" fill="#64748b">QA y Producción: EC2 separadas · Compose: api + notifications · RDS y S3 compartidos en el laboratorio</text>
</svg>
